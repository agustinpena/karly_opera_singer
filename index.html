<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diseños de Muestra — Isabella Moretti</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Georgia, serif;
        background: #f5f1e8;
        color: #2a1418;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        max-width: 600px;
        width: 100%;
        text-align: center;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 400;
        letter-spacing: 2px;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b5a5e;
        font-style: italic;
        margin-bottom: 3rem;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      a {
        display: block;
        padding: 1.5rem 2rem;
        background: #fff;
        border: 1px solid #c9a961;
        color: #2a1418;
        text-decoration: none;
        font-size: 1rem;
        letter-spacing: 1px;
        transition: all 0.3s;
      }
      a:hover {
        background: #c9a961;
        color: #fff;
      }
      a span {
        display: block;
        font-size: 0.8rem;
        color: #6b5a5e;
        margin-top: 0.3rem;
        letter-spacing: 0;
        font-style: italic;
      }
      a:hover span {
        color: #f5f1e8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Isabella Moretti</h1>
      <p>Seleccione un diseño para ver la muestra</p>
      <div class="links">
        <a href="variant-1-classic.html">
          Diseño 1 — Clásico de Ópera
          <span>Borgoña y dorado · Tradicional y prestigioso</span>
        </a>
        <a href="variant-2-minimal.html">
          Diseño 2 — Minimalista
          <span>Marfil y negro · Editorial y moderno</span>
        </a>
        <a href="variant-3-royal.html">
          Diseño 3 — Real
          <span>Azul real y dorado · Regio y noble</span>
        </a>
      </div>
    </div>
  </body>
</html>
